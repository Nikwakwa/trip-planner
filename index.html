<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f7">
  <meta name="description" content="Plan your trips day by day, together. Works offline.">
  <title>Trip Planner</title>
  <script>
    // Pick light or dark before the page is drawn, so it never flashes the wrong color.
    try { var saved = JSON.parse(localStorage.getItem('tripPlanner.v1')); var pick = saved && saved.settings && saved.settings.theme; } catch (e) {}
    document.documentElement.dataset.theme = (pick === 'light' || pick === 'dark') ? pick
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/google-sans-flex.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar" id="appbar">
    <div class="appbar-inner">
      <h1 class="appbar-title" id="appbar-title"></h1>
      <nav id="trip-tabs" class="trip-tabs" aria-label="Trips"></nav>
      <span id="offline-badge" class="offline-pill" hidden>
        <svg class="icon sm" aria-hidden="true"><use href="icons/sprite.svg#cloud_off"/></svg>Offline
      </span>
    </div>
  </header>

  <main id="main">
    <section id="view-plan" class="view"></section>
    <section id="view-ideas" class="view" hidden></section>
    <section id="view-pack" class="view" hidden></section>
    <section id="view-more" class="view" hidden></section>
  </main>

  <button id="fab" class="fab ripple" type="button">
    <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#add"/></svg>
    <span class="fab-label" id="fab-label">New plan</span>
  </button>

  <nav class="navbar" aria-label="Sections">
    <button type="button" data-go="plan" class="active">
      <span class="nav-ind">
        <svg class="icon i-line" aria-hidden="true"><use href="icons/sprite.svg#calendar_month"/></svg>
        <svg class="icon i-fill" aria-hidden="true"><use href="icons/sprite.svg#calendar_month-fill"/></svg>
      </span>Plan
    </button>
    <button type="button" data-go="ideas">
      <span class="nav-ind">
        <svg class="icon i-line" aria-hidden="true"><use href="icons/sprite.svg#lightbulb"/></svg>
        <svg class="icon i-fill" aria-hidden="true"><use href="icons/sprite.svg#lightbulb-fill"/></svg>
      </span>Ideas
    </button>
    <button type="button" data-go="pack">
      <span class="nav-ind">
        <svg class="icon i-line" aria-hidden="true"><use href="icons/sprite.svg#checklist"/></svg>
        <svg class="icon i-fill" aria-hidden="true"><use href="icons/sprite.svg#checklist-fill"/></svg>
      </span>Checklist
    </button>
    <button type="button" data-go="more">
      <span class="nav-ind">
        <svg class="icon i-line" aria-hidden="true"><use href="icons/sprite.svg#settings"/></svg>
        <svg class="icon i-fill" aria-hidden="true"><use href="icons/sprite.svg#settings-fill"/></svg>
      </span>More
    </button>
  </nav>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span class="msg" id="snackbar-msg"></span>
    <button type="button" class="btn text" id="snackbar-action" hidden></button>
  </div>

  <!-- Bottom sheet: add / edit one plan -->
  <dialog id="item-dialog" class="sheet">
    <form id="item-form" method="dialog">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="item-dialog-title" tabindex="-1" autofocus>New plan</h2>
        <button type="button" class="icon-btn ripple" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
        </button>
      </div>
      <label class="field">
        <span class="field-label">What</span>
        <input name="title" required maxlength="120" placeholder="e.g. Walk the Freedom Trail" autocomplete="off">
      </label>
      <fieldset class="choice-chips" id="item-category">
        <legend>Type</legend>
      </fieldset>
      <div class="row2">
        <label class="field"><span class="field-label">Day</span><input type="date" name="date"></label>
        <label class="field"><span class="field-label">Time</span><input type="time" name="time"></label>
      </div>
      <p class="hint">No day? It stays in Ideas until you pick one.</p>
      <label class="field">
        <span class="field-label">Place or address</span>
        <input name="place" maxlength="200" placeholder="e.g. Boston Common" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Link — tickets, booking…</span>
        <input name="link" inputmode="url" maxlength="500" placeholder="https://" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Notes</span>
        <textarea name="notes" rows="2" maxlength="2000" placeholder="Confirmation #, who's coming, tips…"></textarea>
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn text danger ripple" id="item-delete">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#delete"/></svg>Delete
        </button>
        <span class="spacer"></span>
        <button type="submit" class="btn filled lg ripple">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Bottom sheet: add / edit a trip (city) -->
  <dialog id="trip-dialog" class="sheet">
    <form id="trip-form" method="dialog">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="trip-dialog-title" tabindex="-1" autofocus>Trip</h2>
        <button type="button" class="icon-btn ripple" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
        </button>
      </div>
      <label class="field">
        <span class="field-label">City or country</span>
        <input name="name" required maxlength="40" placeholder="e.g. Lisbon, Japan, Tuscany" autocomplete="off">
      </label>
      <p id="place-chosen" class="place-chosen" hidden></p>
      <ul id="place-list" class="place-list" aria-label="Matching places" aria-live="polite" hidden></ul>
      <div class="row2">
        <label class="field"><span class="field-label">First day</span><input type="date" name="start"></label>
        <label class="field"><span class="field-label">Last day</span><input type="date" name="end"></label>
      </div>
      <fieldset class="swatches" id="trip-colors">
        <legend>Color</legend>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" class="btn text danger ripple" id="trip-delete">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#delete"/></svg>Delete trip
        </button>
        <span class="spacer"></span>
        <button type="submit" class="btn filled lg ripple">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Bottom sheet: sign in, so phones with the same login share plans -->
  <dialog id="auth-dialog" class="sheet">
    <form id="auth-form" method="dialog" novalidate>
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 tabindex="-1" autofocus>Sign in to sync</h2>
        <button type="button" class="icon-btn ripple" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
        </button>
      </div>
      <p class="sheet-text">Use the same email and password on every phone that should share these trips. First time? Tap <b>Create account</b>.</p>
      <label class="field">
        <span class="field-label">Email</span>
        <input name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
      </label>
      <div class="field with-btn">
        <label class="field-main">
          <span class="field-label">Password</span>
          <input name="password" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <button type="button" class="icon-btn ripple" id="auth-show" aria-label="Show password" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#visibility"/></svg>
        </button>
      </div>
      <p id="auth-error" class="form-error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button type="button" class="btn text ripple" id="auth-create">Create account</button>
        <span class="spacer"></span>
        <button type="submit" class="btn filled lg ripple">Sign in</button>
      </div>
      <button type="button" class="btn text ripple forgot" id="auth-forgot">Forgot password?</button>
    </form>
  </dialog>

  <!-- Full-height sheet: map of a day's stops (or the whole trip) -->
  <dialog id="map-dialog" class="sheet map-sheet">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-head map-head">
      <div class="map-heading">
        <h2 id="map-title" tabindex="-1" autofocus>Map</h2>
        <p id="map-sub" class="map-sub"></p>
      </div>
      <button type="button" class="icon-btn ripple" data-close aria-label="Close map">
        <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
      </button>
    </div>
    <div id="map" class="map" role="region" aria-label="Map"></div>
    <div id="map-body" class="map-body"></div>
  </dialog>

  <!-- Sheet: the trip's essentials (emergency number, plugs, local time, tips) -->
  <dialog id="info-dialog" class="sheet info-sheet">
    <div class="info-inner">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="info-title" tabindex="-1" autofocus>Essentials</h2>
        <button type="button" class="icon-btn ripple" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
        </button>
      </div>
      <div id="info-body" class="info-body"></div>
    </div>
  </dialog>

  <!-- Sheet: one suggested place in full (description, map, add to a day) -->
  <dialog id="place-dialog" class="sheet">
    <div class="handle" aria-hidden="true"></div>
    <div id="place-body" class="place-body"></div>
  </dialog>

  <!-- Full-height sheet: chat with the AI assistant -->
  <dialog id="ai-dialog" class="sheet ai-sheet">
    <div class="ai-inner">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head ai-head">
        <div class="ai-heading">
          <h2 tabindex="-1" autofocus>Assistant</h2>
          <p id="ai-sub" class="map-sub"></p>
        </div>
        <button type="button" class="icon-btn ripple" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#close"/></svg>
        </button>
      </div>
      <div id="ai-body" class="ai-body" aria-live="polite"></div>
      <form id="ai-form" class="ai-form">
        <textarea id="ai-input" rows="1" maxlength="2000" placeholder="Ask or tell the assistant…" aria-label="Message to the assistant"></textarea>
        <button type="submit" id="ai-send" class="icon-btn filled ripple" aria-label="Send">
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#send"/></svg>
        </button>
      </form>
    </div>
  </dialog>

  <!-- Centered dialog for big decisions -->
  <dialog id="confirm-dialog" class="alert">
    <form method="dialog">
      <svg class="icon alert-icon" aria-hidden="true"><use id="confirm-icon" href="icons/sprite.svg#delete"/></svg>
      <h2 id="confirm-title" tabindex="-1" autofocus></h2>
      <p id="confirm-text"></p>
      <div class="alert-actions">
        <button value="cancel" class="btn text ripple" id="confirm-cancel">Cancel</button>
        <button value="ok" class="btn text ripple" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="theme-probe" hidden></div>
  <script src="firebase-config.js"></script>
  <script src="guides.js"></script>
  <script src="places.js"></script>
  <script src="weather.js"></script>
  <script src="hours.js"></script>
  <script src="essentials.js"></script>
  <script src="maps.js"></script>
  <script src="drag.js"></script>
  <script src="assistant.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
